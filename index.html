<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Presse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Agrégateur de presse</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#16191d;--muted:#5d6672;--line:#dde1e6;--accent:#1f3a5f;--accent-fg:#fff;--chip:#e8ecf1;--danger:#b3261e;--ok:#1e7a46;--warn:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--card:#1a1d22;--fg:#e8eaed;--muted:#9aa3ad;--line:#2c3138;--accent:#7fa7d9;--accent-fg:#0d1520;--chip:#262b32;--danger:#f2817a;--ok:#6fcf97;--warn:#e3b341}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:20px;margin:0;flex:1}
h2{font-size:17px;margin:20px 0 8px}
h3{font-size:15px;margin:14px 0 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on,.seg button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;background:var(--chip);border-radius:6px;padding:2px 6px}
.title{font-weight:600;margin:6px 0 4px;cursor:pointer}
.ex{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:8px;margin-top:10px;align-items:center}
.wrap{flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--danger)}
button:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 0;font-size:13px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:11;display:none}
.open{display:block}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=url],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:100px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--muted);font-size:14px}
.feed{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.feed input{margin-top:3px;width:20px;height:20px;flex:none}
.err{color:var(--danger)}.okc{color:var(--ok)}.warnc{color:var(--warn)}
a{color:var(--accent)}
.status{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.url{word-break:break-all}
</style>
</head>
<body>
<header>
  <div class="row"><h1 id="h-title">À trier</h1><button id="btn-refresh" class="primary">Actualiser</button></div>
  <div class="chips" id="dom-chips"></div>
  <div class="status" id="status"></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-v="trier" class="on">À trier</button>
  <button data-v="classes">Classés</button>
  <button data-v="export">Export</button>
  <button data-v="reglages">Réglages</button>
</nav>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>
<script src="app.js"></script>
</body>
</html>
