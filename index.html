<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presse">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<title>Presse</title>
<style>
:root{
  --bg:#111318;--sc-lowest:#0c0e13;--sc-low:#1a1b21;--sc:#1e1f25;--sc-high:#282a2f;--sc-highest:#33353a;--bright:#37393f;
  --glass:#121824;--on:#e2e2e9;--on-var:#b9cacb;--text:#f4f5f7;--muted:#5d6672;--muted2:#848f9b;--outline:#3b494b;
  --cyan:#00f0ff;--cyan-dim:#00dbe9;--on-cyan:#00363a;--primary:#dbfcff;--primary-fixed:#7df4ff;
  --amber:#feb700;--on-amber:#6b4b00;--amber-soft:#ffdb9d;--amber-fixed:#ffdea8;
  --error:#ffb4ab;--error-c:#93000a;--tertiary:#c6daff;
  --glow-c:0 0 14px rgba(0,240,255,.4);--glow-a:0 0 12px rgba(254,183,0,.35);
  --fh:"Space Grotesk",system-ui,sans-serif;--fb:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--on);font:400 14px/22px var(--fb);letter-spacing:.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;min-height:100dvh}
::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--cyan)}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:18px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;-webkit-font-smoothing:antialiased;user-select:none}
.ms{width:1em;overflow:hidden;text-align:center;flex:none}
html:not(.icons-ready) .ms{color:transparent!important}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
.lbl{font:600 12px/16px var(--fh);letter-spacing:.06em}
.lbl-sm{font:700 10px/14px var(--fh);letter-spacing:.08em;text-transform:uppercase}

/* Barre supérieure */
.appbar{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top);background:rgba(17,19,24,.85);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 4px 24px rgba(0,0,0,.45)}
.appbar .in{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{display:flex;align-items:center;gap:6px;font:700 20px/26px var(--fh);letter-spacing:.1em;color:var(--primary)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.8)}
.net{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--sc-low);color:var(--cyan-dim)}
.net .d{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite}
.net.off{color:var(--error)}.net.off .d{background:var(--error);animation:none}
@keyframes pulse{50%{opacity:.4}}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--on-var)}
.icon-btn .ms{font-size:20px}
.icon-btn:active{color:var(--primary)}

main{padding:calc(64px + env(safe-area-inset-top) + 4px) 16px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-height:100dvh}

/* En-tête de page */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
.title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font:600 24px/30px var(--fh);letter-spacing:-.01em;color:var(--text)}
.count-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;background:var(--amber);color:var(--on-amber);box-shadow:0 0 10px rgba(254,183,0,.4)}
.count-pill:empty{display:none}
.sub{margin:2px 0 0;font-size:12px;line-height:18px;color:var(--muted2);display:flex;align-items:center;gap:6px}
.sub .d{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none}
.refresh{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:var(--glass);color:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.2);text-transform:uppercase;flex:none}
.refresh .u{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.75}
.refresh:active{transform:scale(.95)}
.refresh:disabled{opacity:.7}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pastilles de filtre */
.pills{display:flex;align-items:center;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px;scrollbar-width:none}
.pill-btn{flex:none;display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--sc-high);color:var(--on-var);white-space:nowrap}
.pill-btn.on{background:var(--cyan);color:var(--on-cyan);box-shadow:0 0 12px rgba(0,240,255,.4);padding-left:14px;padding-right:14px}
.pill-btn.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--on-cyan)}
.pills.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

/* Carte de progression */
.panel{position:relative;overflow:hidden;border-radius:12px;background:var(--sc-low);padding:16px}
.prog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.prog-head .l{display:flex;align-items:center;gap:8px;color:var(--muted2)}
.prog-head .l .ms{color:var(--cyan-dim)}
.prog-head .r{color:var(--cyan);font-family:ui-monospace,Menlo,monospace;font-size:11px}
.bar{width:100%;height:6px;border-radius:999px;background:var(--sc-highest);overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--cyan-dim),var(--amber));box-shadow:0 0 8px rgba(0,240,255,.7);transition:width .4s}

/* Cartes article */
.list{display:flex;flex-direction:column;gap:16px}
.card{position:relative;display:flex;flex-direction:column;border-radius:12px;background:rgba(18,24,36,.95);padding:16px;box-shadow:0 8px 32px -4px rgba(0,240,255,.12);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s}
.card .hud{position:absolute;top:8px;right:8px;width:8px;height:8px;border-top:2px solid rgba(0,240,255,.4);border-right:2px solid rgba(0,240,255,.4);pointer-events:none}
.card.amber .hud{border-color:rgba(254,183,0,.4)}
.c-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding-right:10px}
.c-src{display:flex;align-items:center;gap:8px;min-width:0}
.ini{width:24px;height:24px;flex:none;border-radius:6px;background:var(--sc-highest);color:var(--primary-fixed);display:flex;align-items:center;justify-content:center;font:700 11px/1 var(--fh)}
.card.amber .ini{background:rgba(254,183,0,.2);color:var(--amber-soft)}
.src-name{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{color:var(--muted);font-size:11px}
.time{font-size:12px;line-height:18px;color:var(--muted2);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--sc-high);color:var(--cyan-dim);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tag.amber{background:rgba(254,183,0,.15);color:var(--amber-soft)}
.tag.muted{color:var(--on-var)}
.tag.err{background:rgba(147,0,10,.35);color:var(--error)}
.c-main{display:flex;gap:8px;margin-bottom:12px}
.c-text{flex:1;min-width:0}
.c-title{margin:0 0 6px;font:600 20px/26px var(--fh);letter-spacing:-.01em;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.c-ex{margin:0;font-size:12px;line-height:18px;color:var(--on-var);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{position:relative;width:80px;height:80px;flex:none;border-radius:8px;overflow:hidden;background:var(--sc-highest)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(18,24,36,.8),transparent)}
.c-tags{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.c-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
.c-actions .r{display:flex;align-items:center;gap:8px;margin-left:auto}
.c-actions .btn{padding-left:10px;padding-right:10px}
.c-actions .btn.primary,.c-actions .btn.amber{padding-left:14px;padding-right:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 12px;border-radius:8px;font:600 12px/16px var(--fh);letter-spacing:.06em;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--sc);color:var(--on-var)}
.btn.ghost.danger:active{color:var(--error);background:rgba(147,0,10,.2)}
.btn.tonal{background:var(--sc-high);color:var(--on)}
.btn.primary{background:var(--cyan);color:var(--on-cyan);font-weight:700;padding:8px 16px;box-shadow:var(--glow-c)}
.btn.amber{background:var(--amber);color:var(--on-amber);font-weight:700;box-shadow:var(--glow-a)}
.btn.danger-solid{background:rgba(147,0,10,.35);color:var(--error)}
.btn:disabled{opacity:.5}
.more{width:100%;padding:12px}

/* État vide */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 16px;border-radius:16px;background:rgba(26,27,33,.5)}
.empty .ic{width:64px;height:64px;border-radius:50%;background:rgba(0,240,255,.1);color:var(--cyan);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 0 24px rgba(0,240,255,.3)}
.empty .ic .ms{font-size:32px}
.empty h3{margin:0 0 4px;font:600 20px/26px var(--fh);color:var(--text)}
.empty p{margin:0 0 16px;color:var(--muted2);max-width:300px}

/* Formulaires et réglages */
h2{margin:8px 0 0;font:600 16px/22px var(--fh);color:var(--text)}
.muted{color:var(--muted2);font-size:13px;line-height:20px;margin:0}
.field-lbl{display:block;margin:14px 0 6px;color:var(--muted2)}
input[type=text],input[type=url],input[type=number],textarea{width:100%;font:400 16px/24px var(--fb);color:var(--text);background:var(--sc-lowest);border:1px solid var(--outline);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 12px rgba(0,240,255,.25)}
textarea{min-height:100px;resize:vertical}
input[type=checkbox]{accent-color:var(--cyan);width:22px;height:22px;flex:none;margin:0}
.check{display:flex;align-items:center;gap:10px;color:var(--on);font-size:14px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(59,73,75,.5)}
.mrow:last-child{border-bottom:0}
.mrow .t{flex:1;min-width:0}
.mrow .n{color:var(--text);font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mrow .s{font-size:12px;line-height:18px;color:var(--muted2);margin-top:2px}
.ok{color:var(--cyan-dim)}.warn{color:var(--amber)}.err{color:var(--error)}
.url{word-break:break-all;font-size:12px;color:var(--muted2)}
details summary{cursor:pointer;color:var(--error);font-size:12px}
.statusline{min-height:18px;font-size:12px;color:var(--muted2);margin-top:6px}

/* Barre de navigation */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;padding-bottom:env(safe-area-inset-bottom);background:rgba(18,24,36,.9);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);box-shadow:0 -8px 32px -4px rgba(0,240,255,.12)}
nav.bottom .in{height:72px;display:flex;align-items:center;justify-content:space-around;padding:0 4px}
nav.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;min-height:44px;color:var(--on-var)}
nav.bottom button .ms{font-size:22px}
nav.bottom button.on{color:var(--cyan);filter:drop-shadow(0 0 8px rgba(0,240,255,.6));font-weight:700}
nav.bottom .ico{position:relative;display:flex}
nav.bottom .badge{position:absolute;top:-4px;right:-10px;min-width:14px;height:14px;padding:0 4px;border-radius:999px;background:var(--amber);color:var(--on-amber);font:700 9px/14px var(--fh);text-align:center;box-shadow:0 0 8px rgba(255,184,0,.5)}
nav.bottom .badge:empty{display:none}

/* Feuille de classement */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;display:none;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--glass);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,240,255,.15)}
.sheet .grab{width:40px;height:4px;border-radius:999px;background:var(--sc-highest);margin:-8px auto 12px}
.sheet .s-title{margin:6px 0 4px;font:600 18px/24px var(--fh);color:var(--text)}
.open{display:block!important}

/* Lecteur */
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#reader.open{display:flex!important}
.r-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:rgba(17,19,24,.9);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 4px 24px rgba(0,0,0,.45)}
.r-src{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text)}
.r-src span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#r-count{margin-right:8px}
#r-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.article{max-width:680px;margin:0 auto;padding:20px 18px 48px;-webkit-user-select:text;user-select:text}
.r-kicker{color:var(--cyan-dim);margin-bottom:8px}
.article h1{font:600 26px/32px var(--fh);letter-spacing:-.02em;color:var(--text);margin:0 0 12px}
.article .lead{margin:0 0 16px;font:italic 400 17px/27px var(--fb);color:var(--on-var)}
.article .lead:empty{display:none}
#r-body{font:400 17px/28px var(--fb);color:var(--on)}
#r-body p{margin:0 0 18px}
#r-body h2,#r-body h3,#r-body h4{font-family:var(--fh);color:var(--text);line-height:1.3;margin:26px 0 10px}
#r-body h2{font-size:20px}#r-body h3,#r-body h4{font-size:17px}
#r-body a{color:var(--cyan-dim)}
#r-body img{max-width:100%;height:auto;display:block;margin:12px auto;border-radius:8px}
#r-body figure{margin:16px 0}
#r-body figcaption{font-size:13px;line-height:20px;color:var(--muted2)}
#r-body blockquote{margin:0 0 18px;padding-left:14px;border-left:2px solid var(--cyan)}
#r-body mark{background:rgba(254,183,0,.28);color:var(--amber-fixed);border-radius:3px;padding:1px 0;box-shadow:0 0 0 1px rgba(254,183,0,.22);cursor:pointer}
#r-note .note{margin:8px 0 12px;padding:10px 12px;border-radius:10px;background:rgba(254,183,0,.12);color:var(--amber-soft);font-size:13px;line-height:20px}
#r-note .foot{font-size:12px;color:var(--muted2)}
.linkbtn{color:var(--cyan);text-decoration:underline;font-size:12px}
.r-bar{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(18,24,36,.95);box-shadow:0 -8px 32px -4px rgba(0,240,255,.12)}
.r-bar .btn{flex:1;padding:14px;font-size:13px}
.r-bar .btn .ms{font-size:20px}
#btn-hl{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#btn-hl.ready{background:var(--amber);color:var(--on-amber);box-shadow:var(--glow-a)}

/* Notification */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,8px);z-index:90;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(18,24,36,.95);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:var(--primary);box-shadow:0 0 20px rgba(0,240,255,.3);opacity:0;pointer-events:none;transition:all .3s;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .ms{color:var(--cyan)}
</style>
</head>
<body>
<header class="appbar">
  <div class="in">
    <div class="brand">
      <div class="logo"><span class="cdot"></span>PRESSE</div>
      <div class="net lbl-sm" id="net"><span class="d"></span><span id="net-t">En ligne</span></div>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Réglages"><span class="ms">tune</span></button>
  </div>
</header>

<main id="main"></main>

<nav class="bottom" id="nav">
  <div class="in">
    <button data-v="trier" class="on"><span class="ico"><span class="ms">view_carousel</span><span class="badge" id="badge"></span></span><span class="lbl">À trier</span></button>
    <button data-v="classes"><span class="ms">inventory_2</span><span class="lbl">Classés</span></button>
    <button data-v="export"><span class="ms">send_and_archive</span><span class="lbl">Export</span></button>
    <button data-v="reglages"><span class="ms">settings</span><span class="lbl">Réglages</span></button>
  </div>
</nav>

<div id="reader" role="dialog" aria-label="Lecture de l'article">
  <div class="r-top">
    <button class="icon-btn" id="r-back" aria-label="Retour"><span class="ms">arrow_back</span></button>
    <div class="r-src lbl"><span class="ini" id="r-ini"></span><span id="r-src"></span></div>
    <span class="count-pill lbl-sm" id="r-count"></span>
  </div>
  <div id="r-scroll">
    <article class="article">
      <div class="r-kicker lbl-sm" id="r-meta"></div>
      <h1 id="r-title"></h1>
      <p class="lead" id="r-lead"></p>
      <div id="r-body"></div>
      <div id="r-note"></div>
    </article>
  </div>
  <div class="r-bar">
    <button id="btn-hl" class="btn tonal" type="button"><span class="ms">ink_highlighter</span><span>SURLIGNER</span></button>
    <button id="r-classer" class="btn primary" type="button"><span class="ms fill">check_circle</span><span>CLASSER</span></button>
  </div>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>
<div id="toast" role="status"><span class="ms" id="toast-icon">check</span><span class="lbl" id="toast-text"></span></div>
<script src="app.js"></script>
</body>
</html>
